<div class="container">

    <h2 class="mb-4">Gestión de Categorías</h2>

    <div class="card mb-4">
        <div class="card-body">

            <h5 class="mb-3">Nueva Categoría</h5>

            <div class="row g-3">

                <div class="col-md-4">
                    <input class="form-control" placeholder="Nombre" [(ngModel)]="nuevaCategoria.nombre">
                </div>

                <div class="col-md-6">
                    <input class="form-control" placeholder="Descripción" [(ngModel)]="nuevaCategoria.descripcion">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-success w-100" (click)="crearCategoria()">
                        Crear
                    </button>
                </div>

            </div>

        </div>
    </div>

    <div class="mb-3">
        <input class="form-control" placeholder="Buscar categoría..." [(ngModel)]="searchTerm"
            (ngModelChange)="buscar()">
    </div>

    <div class="card">
        <div class="card-body">

            <div *ngIf="loading" class="text-center my-3">
                <div class="spinner-border"></div>
            </div>

            <table class="table table-striped" *ngIf="!loading && categorias.length>0">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr *ngFor="let categoria of categorias">

                        <td>{{categoria.id}}</td>

                        <td>

                            <ng-container *ngIf="categoriaEditando?.id!==categoria.id">
                                {{categoria.nombre}}
                            </ng-container>

                            <input *ngIf="categoriaEditando?.id===categoria.id" class="form-control"
                                [(ngModel)]="categoriaEditando!.nombre">

                        </td>

                        <td>

                            <ng-container *ngIf="categoriaEditando?.id!==categoria.id">
                                {{categoria.descripcion}}
                            </ng-container>

                            <input *ngIf="categoriaEditando?.id===categoria.id" class="form-control"
                                [(ngModel)]="categoriaEditando!.descripcion">

                        </td>

                        <td>

                            <ng-container *ngIf="categoriaEditando?.id!==categoria.id">

                                <button class="btn btn-primary btn-sm me-2" (click)="editarCategoria(categoria)">
                                    Editar
                                </button>

                                <button class="btn btn-danger btn-sm" (click)="abrirModalEliminar(categoria.id)">
                                    Eliminar
                                </button>

                            </ng-container>

                            <ng-container *ngIf="categoriaEditando?.id===categoria.id">

                                <button class="btn btn-success btn-sm me-2" (click)="guardarEdicion()">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" (click)="cancelarEdicion()">
                                    Cancelar
                                </button>

                            </ng-container>

                        </td>

                    </tr>

                </tbody>

            </table>

            <div *ngIf="!loading && categorias.length===0" class="text-center text-muted">
                No hay categorías para mostrar.
            </div>


            <app-pagination class="mt-3" [paginaActual]="paginaActual" [totalPaginas]="totalPaginas"
                (paginaChange)="cambiarPagina($event)">
            </app-pagination>

        </div>
    </div>

    <app-modal-confirmacion *ngIf="categoriaAEliminar" titulo="Eliminar categoría"
        mensaje="¿Seguro que deseas eliminar esta categoría?" (confirmar)="confirmarEliminacion()"
        (cancelar)="categoriaAEliminar=null">
    </app-modal-confirmacion>

</div>
