<div class="container mt-4" style="max-width: 400px;">

  <form [formGroup]="registerForm">

    <h3 class="text-center mb-4">Crear cuenta</h3>

    <!-- USERNAME -->
    <div class="mb-3">
      <input type="text" placeholder="Usuario" formControlName="username" class="form-control" />
      <div class="text-danger small"
        *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
        El usuario es obligatorio
      </div>
    </div>

    <!-- NOMBRE -->
    <div class="mb-3">
      <input type="text" placeholder="Nombre" formControlName="first_name" class="form-control" />
      <div class="text-danger small"
        *ngIf="registerForm.get('first_name')?.invalid && registerForm.get('first_name')?.touched">
        El nombre es obligatorio
      </div>
    </div>

    <!-- APELLIDO -->
    <div class="mb-3">
      <input type="text" placeholder="Apellido" formControlName="last_name" class="form-control" />
      <div class="text-danger small"
        *ngIf="registerForm.get('last_name')?.invalid && registerForm.get('last_name')?.touched">
        El apellido es obligatorio
      </div>
    </div>

    <!-- EMAIL -->
    <div class="mb-3">
      <input type="email" placeholder="Email" formControlName="email" class="form-control" />
      <div class="text-danger small" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors">

        <div *ngIf="registerForm.get('email')?.errors?.['required']">
          El email es obligatorio
        </div>

        <div *ngIf="registerForm.get('email')?.errors?.['email']">
          Formato de email inválido
        </div>

      </div>
    </div>

    <!-- PASSWORD -->
    <div class="mb-3">
      <input type="password" placeholder="Contraseña" formControlName="password" class="form-control" />
      <div class="text-danger small"
        *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors">

        <div *ngIf="registerForm.get('password')?.errors?.['required']">
          La contraseña es obligatoria
        </div>

        <div *ngIf="registerForm.get('password')?.errors?.['minlength']">
          Debe tener al menos 6 caracteres
        </div>

      </div>
    </div>

    <!-- BOTÓN -->
    <button type="button" class="btn btn-primary w-100" [disabled]="loading" (click)="onSubmit()">
      {{ loading ? 'Registrando...' : 'Registrarse' }}
    </button>

    <!-- ERRORES BACKEND -->
    <div *ngIf="errorMessages.length" class="alert alert-danger mt-3">
      <ul class="mb-0">
        <li *ngFor="let err of errorMessages">{{ err }}</li>
      </ul>
    </div>

  </form>

</div>

<!-- ========================= -->
<!-- 🔥 MODAL DE ÉXITO -->
<!-- ========================= -->
<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Registro exitoso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <p class="mb-0">
          🎉 Tu cuenta fue creada correctamente
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-success w-100" data-bs-dismiss="modal" (click)="goToProductos()">
          Ir a productos
        </button>
      </div>

    </div>
  </div>
</div>
