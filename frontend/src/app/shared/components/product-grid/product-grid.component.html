<!-- Si hay productos para mostrar, se renderiza la grilla. -->
<div class="productos-grid" *ngIf="productos.length > 0">

  <div class="row g-4">

    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let producto of productos">

      <!--
        Se utiliza ProductCardComponent para mostrar cada producto.
        [producto] le pasa el producto actual al componente hijo.
        variant define el estilo compacto de la tarjeta.
        (verDetalle) escucha el evento emitido por el componente hijo.
        abrirDetalle recibe el ID y lo emite al componente padre.
      -->
      <app-product-card
        [producto]="producto"
        variant="compact"
        (verDetalle)="abrirDetalle($event)">
      </app-product-card>

    </div>

  </div>

</div>
